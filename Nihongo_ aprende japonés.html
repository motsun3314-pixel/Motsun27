<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo: aprende japonés</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#F2F3EF;--sf:#FFFFFF;--tx:#1B2530;--mu:#667180;--ac:#264A6B;--on:#FFFFFF;--sh:#C8432B;--ok:#2F7D5B;--bd:#DADDD6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161B;--sf:#1B2129;--tx:#E8EBEE;--mu:#98A3B0;--ac:#8DB4DB;--on:#12161B;--sh:#E0705A;--ok:#5BBE95;--bd:#2A323C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161B;--sf:#1B2129;--tx:#E8EBEE;--mu:#98A3B0;--ac:#8DB4DB;--on:#12161B;--sh:#E0705A;--ok:#5BBE95;--bd:#2A323C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 96px}
h1{font:600 34px/1.2 "Shippori Mincho","Hiragino Mincho ProN",serif;margin:4px 0 2px}
h2{font-size:18px;margin:22px 0 10px}h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-weight:700;width:100%;margin-top:8px}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:focus-visible{outline:3px solid var(--sh);outline-offset:2px}
.big{font:600 72px/1.1 "Shippori Mincho","Hiragino Mincho ProN",serif;text-align:center;margin:12px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 8px;font-size:18px;min-height:54px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--sf))}
.opt.no{border-color:var(--sh);background:color-mix(in srgb,var(--sh) 16%,var(--sf))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 4px;text-align:center}
.tile b{display:block;font:600 34px/1.2 "Shippori Mincho",serif}
.lsn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.lsn[disabled]{opacity:.45;cursor:not-allowed}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-weight:700;flex:none}
.dot.d{background:var(--ok);border-color:var(--ok);color:var(--on)}
.f{background:var(--bg);border-left:3px solid var(--sh);padding:8px 12px;font-weight:700}
.ex{border-left:3px solid var(--ac);padding:2px 12px;margin:8px 0;font-size:18px}.ex span{display:block;font-size:14px;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:13px 2px;font-size:13px;color:var(--mu);position:relative}
nav button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 3px var(--sh)}
nav em{position:absolute;top:6px;margin-left:2px;background:var(--sh);color:var(--on);border-radius:9px;font:700 11px/1 inherit;padding:3px 5px;font-style:normal}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%}
.toast.s{opacity:1;transform:translate(-50%,0)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal i{aspect-ratio:1;border-radius:5px;background:var(--bd)}.cal i.a{background:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}.bars i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.pop{animation:pop .5s}@keyframes pop{from{transform:scale(.6);opacity:0}}
.ck{color:var(--ok);font-weight:700}.tk{background:none;border:0;border-bottom:2px dotted var(--sh);padding:0 1px;font:inherit;color:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const RN=["Vocales","Fila K","Fila S","Fila T","Fila N","Fila H","Fila M","Fila Y","Fila R","Fila W y N"],RS=[5,5,5,5,5,5,5,3,5,3];
const VOC=[
{t:"Saludos y básicos",w:[["おはよう","おはよう","buenos días","expresión","おはよう、たなかさん。","Buenos días, Tanaka."],["こんにちは","こんにちは","hola","expresión","こんにちは、はじめまして。","Hola, mucho gusto."],["ありがとう","ありがとう","gracias","expresión","どうもありがとう。","Muchas gracias."],["はい","はい","sí","expresión","はい、わかりました。","Sí, entendido."],["いいえ","いいえ","no","expresión","いいえ、だいじょうぶです。","No, estoy bien."],["すみません","すみません","disculpe","expresión","すみません、もういちど。","Perdón, otra vez por favor."],["私","わたし","yo","pronombre","わたしはマリアです。","Yo soy María."],["名前","なまえ","nombre","sustantivo","なまえはなんですか。","¿Cómo te llamas?"]]},
{t:"Personas y cosas",w:[["水","みず","agua","sustantivo","みずをください。","Agua, por favor."],["ご飯","ごはん","comida, arroz","sustantivo","ごはんをたべます。","Como arroz."],["本","ほん","libro","sustantivo","ほんをよみます。","Leo un libro."],["学生","がくせい","estudiante","sustantivo","わたしはがくせいです。","Soy estudiante."],["先生","せんせい","profesor","sustantivo","かれはせんせいです。","Él es profesor."],["猫","ねこ","gato","sustantivo","ねこがすきです。","Me gustan los gatos."],["犬","いぬ","perro","sustantivo","いぬはいえにいます。","El perro está en casa."],["家","いえ","casa","sustantivo","いえにかえります。","Vuelvo a casa."]]},
{t:"Acciones y descripciones",w:[["食べる","たべる","comer","verbo","さかなをたべる。","Como pescado."],["飲む","のむ","beber","verbo","おちゃをのむ。","Bebo té."],["行く","いく","ir","verbo","がっこうへいく。","Voy a la escuela."],["見る","みる","ver","verbo","テレビをみる。","Veo televisión."],["大きい","おおきい","grande","adjetivo い","おおきいいえです。","Es una casa grande."],["小さい","ちいさい","pequeño","adjetivo い","ちいさいねこです。","Es un gato pequeño."],["静か","しずか","tranquilo","adjetivo な","しずかなまちです。","Es un pueblo tranquilo."],["好き","すき","que gusta","adjetivo な","いぬがすきです。",'Me gustan los perros.']]},{t:'Familia y lugares',w:[['母','はは','mi madre','sustantivo','はははせんせいです。','Mi madre es profesora.'],['父','ちち','mi padre','sustantivo','ちちはいえにいます。','Mi padre está en casa.'],['友達','ともだち','amigo','sustantivo','ともだちとはなします。','Hablo con un amigo.'],['学校','がっこう','escuela','sustantivo','がっこうにいきます。','Voy a la escuela.'],['駅','えき','estación','sustantivo','えきはどこですか。','¿Dónde está la estación?'],['トイレ','トイレ','baño','sustantivo','トイレはあそこです。','El baño está allá.'],['どこ','どこ','¿dónde?','pregunta','ここはどこですか。','¿Dónde estamos?'],['何','なに','¿qué?','pregunta','これはなんですか。','¿Qué es esto?']]},{t:'Tiempo y comida',w:[['今日','きょう','hoy','tiempo','きょうはあついです。','Hoy hace calor.'],['明日','あした','mañana','tiempo','あしたがっこうにいきます。','Mañana voy a la escuela.'],['今','いま','ahora','tiempo','いまなんじですか。','¿Qué hora es?'],['お茶','おちゃ','té','sustantivo','おちゃをください。','Té, por favor.'],['パン','パン','pan','sustantivo','パンをたべます。','Como pan.'],['魚','さかな','pescado','sustantivo','さかながすきです。','Me gusta el pescado.'],['買う','かう','comprar','verbo','パンをかいます。','Compro pan.'],['話す','はなす','hablar','verbo','ともだちとはなす。','Hablo con un amigo.']]}];
const GR=[
{t:"は y です: «A es B»",x:"<p>は marca el <b>tema</b> de la oración y se lee <b>wa</b>. です cierra la frase con cortesía y funciona como «ser».</p><p class=f>A は B です</p><p>Negativo cortés: ではありません.</p><p class=mu>Error frecuente: leer は como «ha». Como partícula siempre es «wa».</p>",ex:[["わたしはがくせいです。","Yo soy estudiante."],["これはほんです。","Esto es un libro."]],q:[["わたし＿がくせいです。",["は","を","に","で"],"は","は marca el tema: «yo»."],["¿Cómo se lee は en これはほんです?",["wa","ha","ba","no"],"wa","Como partícula, は se lee wa."],["«Él es profesor»",["かれはせんせいです。","かれをせんせいです。","かれにせんせいです。"],"かれはせんせいです。","Tema + は + sustantivo + です."],["Negativo de がくせいです",["がくせいではありません","がくせいですない","がくせいでした"],"がくせいではありません","です pasa a ではありません."]]},
{t:"を: el objeto",x:"<p>を (se lee <b>o</b>) marca el <b>objeto directo</b>: lo que recibe la acción.</p><p class=f>Objeto を Verbo</p><p>Los verbos corteses terminan en ます: たべる → たべます.</p>",ex:[["みずをのみます。","Bebo agua."],["ほんをよみます。","Leo un libro."]],q:[["みず＿のみます。",["を","は","に","の"],"を","El agua es lo que se bebe: objeto directo."],["ごはん＿たべます。",["を","で","へ","と"],"を","Lo que se come es el objeto."],["ほんをよみます significa…",["Leo un libro","Voy al libro","Estoy en el libro"],"Leo un libro","を + よみます (leer)."],["Forma ます de たべる",["たべます","たべるます","たべです"],"たべます","Se quita る y se añade ます."]]},
{t:"に y で: lugares",x:"<p><b>に</b>: destino, hora exacta y lugar donde algo existe (います, あります).</p><p><b>で</b>: lugar donde ocurre una acción, o medio.</p><p class=f>Lugar に いきます / Lugar で Verbo</p>",ex:[["がっこうにいきます。","Voy a la escuela."],["レストランでたべます。","Como en el restaurante."]],q:[["がっこう＿いきます。",["に","で","を","と"],"に","Destino de un movimiento: に."],["レストラン＿ごはんをたべます。",["で","に","は","の"],"で","Lugar donde ocurre la acción: で."],["ねこはいえ＿います。",["に","で","を","も"],"に","Existencia (います) usa に."],["しちじ＿おきます。",["に","で","を","が"],"に","Las horas exactas llevan に."]]},
{t:"Adjetivos い y な",x:"<p>Los adjetivos <b>い</b> terminan en い (おおきい). Los <b>な</b> necesitan な ante un sustantivo (しずかなまち).</p><p class=f>Negativo い: quita い y añade くない</p><p class=mu>Ojo: きれい termina en い pero es un adjetivo な.</p>",ex:[["おおきいいえです。","Es una casa grande."],["しずかなまちです。","Es un pueblo tranquilo."]],q:[["しずか＿まち",["な","の","が","い"],"な","しずか es adjetivo な."],["«Gato pequeño»",["ちいさいねこ","ちいさくねこ","ちいさのねこ"],"ちいさいねこ","El adjetivo い va directo ante el sustantivo."],["Negativo de たかい (caro)",["たかくない","たかじゃない","たかいくない"],"たかくない","Se cambia い por くない."],["きれい (bonito) es un adjetivo…",["tipo な","tipo い"],"tipo な",'Termina en い, pero es な: きれいなひと.']]},{t:'Verbos en ます: presente y pasado',x:'<p>Forma cortés: <b>ます</b> (presente o futuro), <b>ません</b> (negativo), <b>ました</b> (pasado) y <b>ませんでした</b> (pasado negativo).</p><p class=f>たべます, たべません, たべました, たべませんでした</p>',ex:[['あさごはんをたべました。','Desayuné.'],['おちゃをのみません。','No bebo té.']],q:[['«No como pescado»',['さかなをたべません','さかなをたべました','さかなをたべます'],'さかなをたべません','ません niega el presente.'],['Pasado de いきます',['いきました','いきません','いきましょう'],'いきました','ます pasa a ました.'],['«Ayer vi televisión»',['きのうテレビをみました','きのうテレビをみます','きのうテレビをみません'],'きのうテレビをみました','Ayer es pasado: ました.'],['Pasado negativo de のみます',['のみませんでした','のみました','のみません'],'のみませんでした','ませんでした significa «no hice».']]},{t:'も, と, の y から',x:'<p><b>も</b> = también. <b>と</b> = y, con. <b>の</b> = de (posesión). <b>から</b> = desde.</p><p class=f>わたしの + sustantivo / A と B / A も</p>',ex:[['わたしのほんです。','Es mi libro.'],['ともだちとたべます。','Como con un amigo.']],q:[['«Yo también soy estudiante»: わたし＿がくせいです。',['も','は','の','と'],'も','も significa «también».'],['«Mi libro»: わたし＿ほん',['の','と','も','で'],'の','の indica posesión.'],['«Con un amigo»: ともだち＿いきます。',['と','を','の','も'],'と','と significa «con».'],['«Desde las nueve»: くじ＿',['から','まで','の','を'],'から','から significa «desde».']]}];
const KJ=[['一','uno','いち','ひと(つ)','一人','ひとり','una persona'],['二','dos','に','ふた(つ)','二月','にがつ','febrero'],['三','tres','さん','み(つ)','三月','さんがつ','marzo'],['四','cuatro','し','よん','四月','しがつ','abril'],['五','cinco','ご','いつ(つ)','五月','ごがつ','mayo'],['六','seis','ろく','む(つ)','六月','ろくがつ','junio'],['七','siete','しち','なな','七月','しちがつ','julio'],['八','ocho','はち','や(つ)','八月','はちがつ','agosto'],['九','nueve','きゅう','ここの(つ)','九月','くがつ','septiembre'],['十','diez','じゅう','とお','十月','じゅうがつ','octubre'],['日','día, sol','にち','ひ','日本','にほん','Japón'],['月','luna, mes','げつ','つき','月曜日','げつようび','lunes'],['火','fuego','か','ひ','火曜日','かようび','martes'],['水','agua','すい','みず','水曜日','すいようび','miércoles'],['木','árbol','もく','き','木曜日','もくようび','jueves'],['人','persona','じん','ひと','日本人','にほんじん','japonés (persona)'],['山','montaña','さん','やま','富士山','ふじさん','monte Fuji'],['川','río','せん','かわ','川','かわ','río'],['口','boca','こう','くち','出口','でぐち','salida'],['目','ojo','もく','め','目','め','ojo']];
const RD=[{id:'r0',unit:'Lecturas',title:'Presentación',sub:'Texto de 4 líneas',type:'read',req:'h9',L:[[[['わたし','わたし','yo'],'は ',['マリア','マリア','María'],'です。'],'Yo soy María.'],[[['がくせい','がくせい','estudiante'],'です。'],'Soy estudiante.'],[[['ねこ','ねこ','gato'],'が ',['すき','すき','que gusta'],'です。'],'Me gustan los gatos.'],[[['ともだち','ともだち','amigo'],'も ',['ねこ','ねこ','gato'],'が ',['すき','すき','que gusta'],'です。'],'A mi amigo también le gustan.']],Q:[['¿Cómo se llama la protagonista?',['María','Tanaka','Ana'],'María'],['¿Qué le gusta?',['Los gatos','Los perros','El té'],'Los gatos']]},{id:'r1',unit:'Lecturas',title:'En el café',sub:'Diálogo corto',type:'read',req:'v0',L:[[[['すみません','すみません','disculpe'],'。',['みず','みず','agua'],'を ',['ください','ください','por favor'],'。'],'Disculpe, agua por favor.'],[[['はい','はい','sí'],'、',['どうぞ','どうぞ','aquí tiene'],'。'],'Sí, aquí tiene.'],[[['ありがとう','ありがとう','gracias'],'ございます。'],'Muchas gracias.']],Q:[['¿Qué pide la persona?',['Agua','Té','Pan'],'Agua'],['¿Qué significa どうぞ?',['Aquí tiene','Perdón','Adiós'],'Aquí tiene']]},{id:'r2',unit:'Lecturas',title:'Mi día',sub:'Rutina diaria',type:'read',req:'g1',L:[[[['わたし','わたし','yo'],'は ',['しちじ','しちじ','las siete'],'に ',['おきます','おきます','levantarse'],'。'],'Me levanto a las siete.'],[[['がっこう','がっこう','escuela'],'に ',['いきます','いきます','ir'],'。'],'Voy a la escuela.'],[[['ひるごはん','ひるごはん','almuerzo'],'を ',['たべます','たべます','comer'],'。'],'Almuerzo.'],[[['ともだち','ともだち','amigo'],'と ',['はなします','はなします','conversar'],'。'],'Converso con amigos.']],Q:[['¿A qué hora se levanta?',['A las 7','A las 8','A las 6'],'A las 7'],['¿Adónde va?',['A la escuela','Al parque','A casa'],'A la escuela'],['¿Con quién conversa?',['Con amigos','Con su madre','Con nadie'],'Con amigos']]}];
const LS=[];
const mk=a=>a.split(' ').map(s=>{const m=s.match(/^([ぁ-ん]+)([a-z]+)$/);return{h:m[1],r:m[2]}});
const KD=mk('がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢdji づdzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo'),KY=mk('きゃkya きゅkyu きょkyo しゃsha しゅshu しょsho ちゃcha ちゅchu ちょcho にゃnya にゅnyu にょnyo ひゃhya ひゅhyu ひょhyo みゃmya みゅmyu みょmyo りゃrya りゅryu りょryo ぎゃgya ぎゅgyu ぎょgyo じゃja じゅju じょjo びゃbya びゅbyu びょbyo ぴゃpya ぴゅpyu ぴょpyo'),ALLK=[...KANA,...KD,...KY];
[['h','Hiragana'],['k','Katakana']].forEach(([sc,un])=>[['',un,KANA,RS,RN,null],['d',un+' con marcas',KD,[5,5,5,5,5],['Fila G','Fila Z','Fila D','Fila B','Fila P'],sc+'9'],['y',un+' combinados',KY,[6,6,6,6,6,3],['Grupo 1','Grupo 2','Grupo 3','Grupo 4','Grupo 5','Grupo 6'],sc+'d4']].forEach(([g,u,A,Z,N,rq])=>{let o=0;Z.forEach((n,i)=>{LS.push({id:sc+g+i,unit:u,title:N[i],type:'kana',sc,chars:A.slice(o,o+n),req:i?sc+g+(i-1):rq});o+=n})}));

[['Números 1 a 5',0],['Números 6 a 10',5],['Días y naturaleza',10],['Personas y cuerpo',15]].forEach(([t,o],i)=>LS.push({id:'j'+i,unit:'Kanji básicos',title:t,type:'kanji',ks:KJ.slice(o,o+5),req:i?'j'+(i-1):'v0'}));const ALL=[...LS,...RD];
const def=()=>({xp:0,days:{},done:{},cards:{},lerr:{},secs:0,theme:"auto",rev:0,ach:{},best:0,sv:{}});
function load(){try{const r=localStorage.getItem(KEY);if(r)return{...def(),...JSON.parse(r)}}catch(e){}return def()}
let S=load(),V="home",R=null,RV=null,last=Date.now();

const day=()=>S.days[today()]||(S.days[today()]={xp:0,s:0,l:0,r:0});
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const opts=(a,p)=>shuf([a,...shuf(p.filter(x=>x!==a)).slice(0,3)]);
const lvl=x=>Math.floor(Math.sqrt(x/40))+1,xpFor=l=>40*(l-1)**2;
const dc=p=>Object.keys(S.done).filter(k=>k[0]==p).length;
function tick(){const n=Date.now(),d=Math.min(30,(n-last)/1000);last=n;S.secs+=d;day().s+=d}
function toast(t){const e=$("#t");e.textContent=t;e.classList.add("s");clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove("s"),2600)}
function gain(n){const l=lvl(S.xp);S.xp+=n;day().xp+=n;if(lvl(S.xp)>l)toast("¡Nivel "+lvl(S.xp)+"!")}
function streak(){let c=0,d=new Date();if(!(S.days[fmt(d)]||{}).xp)d.setDate(d.getDate()-1);while((S.days[fmt(d)]||{}).xp>0){c++;d.setDate(d.getDate()-1)}return c}
const weekL=()=>{let n=0,d=new Date();for(let i=0;i<7;i++){n+=(S.days[fmt(d)]||{}).l||0;d.setDate(d.getDate()-1)}return n};
const dueList=()=>Object.entries(S.cards).filter(([k,c])=>c.d<=Date.now()).sort((a,b)=>a[1].e-b[1].e).map(x=>x[0]);
const rv=()=>{const d=day();return d.r>=10||(d.r>0&&dueList().length==0)};
const ACH=[["Primer paso","Completa tu primera lección",()=>Object.keys(S.done).length>=1],["Maestro del hiragana",'Completa las 21 lecciones de hiragana',()=>dc('h')>=21],["Maestro del katakana",'Completa las 21 lecciones de katakana',()=>dc('k')>=21],["Lector de palabras",'Aprende 40 palabras',()=>dc('v')>=5],["Gramática base",'Completa las 6 lecciones de gramática',()=>dc('g')>=6],["Constancia","Estudia 3 días seguidos",()=>streak()>=3],["Memoria activa","Repasa 50 tarjetas",()=>S.rev>=50],["Nivel 5","Llega al nivel 5",()=>lvl(S.xp)>=5],['Primeros kanji','Completa los 4 grupos de kanji',()=>dc('j')>=4],['Lector','Completa las 3 lecturas',()=>dc('r')>=3],["Dominio","Saca 100% en una lección",()=>Object.values(S.done).some(x=>x==100)]];
function after(){const d=day();[d.l>=1,rv(),d.s>=600].forEach((ok,i)=>{if(ok&&!d["b"+i]){d["b"+i]=1;gain(10);toast("Misión cumplida: +10 XP")}});
ACH.forEach(a=>{if(!S.ach[a[0]]&&a[2]()){S.ach[a[0]]=today();toast("Logro: "+a[0])}});S.best=Math.max(S.best,streak());save()}
const speak=t=>{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";speechSynthesis.cancel();speechSynthesis.speak(u)}else toast("Tu dispositivo no tiene voz japonesa")};
const unlocked=l=>!l.req||l.req in S.done;
const kf=(l,c)=>l.sc=="k"?kat(c.h):c.h;
function build(l){
if(l.type=='kanji'){const M=KJ.map(x=>x[1]),K=KJ.map(x=>x[0]),W=KJ.map(x=>x[5]);let q=[];l.ks.forEach(x=>{q.push({big:x[0],p:'¿Qué significa?',o:opts(x[1],M),a:x[1]});q.push({big:x[1],p:'Elige el kanji',o:opts(x[0],K),a:x[0]});q.push({big:x[4],p:'¿Cómo se lee?',o:opts(x[5],W),a:x[5]})});return shuf(q).slice(0,12)}
if(l.type=='read')return l.Q.map(x=>({p:x[0],o:shuf(x[1]),a:x[2]}));
if(l.type=="kana"){const P=ALLK.map(c=>c.r),Q=ALLK.map(c=>kf(l,c));let q=[];l.chars.forEach(c=>{q.push({big:kf(l,c),p:"¿Cómo se lee?",o:opts(c.r,P),a:c.r});q.push({big:c.r,p:"Elige el carácter",o:opts(kf(l,c),Q),a:kf(l,c)})});return shuf(q).slice(0,10)}
if(l.type=="vocab"){const E=VOC.flatMap(v=>v.w.map(w=>w[2])),J=VOC.flatMap(v=>v.w.map(w=>w[0]));let q=[];l.words.forEach(w=>{q.push({big:w[0],sub:w[1],p:"¿Qué significa?",o:opts(w[2],E),a:w[2]});q.push({big:w[2],p:"¿Cómo se dice en japonés?",o:opts(w[0],J),a:w[0]})});return shuf(q).slice(0,12)}
return l.g.q.map(x=>({p:x[0],o:shuf(x[1]),a:x[2],w:x[3]}))}
function addCards(l){const t=Date.now();if(l.type=='kanji')l.ks.forEach(x=>{const k='j:'+x[0];S.cards[k]=S.cards[k]||{d:t,i:0,e:2.5,n:0}});if(l.type=="kana")l.chars.forEach(c=>{const k="k:"+l.sc+":"+c.h;S.cards[k]=S.cards[k]||{d:t,i:0,e:2.5,n:0}});if(l.type=="vocab")l.words.forEach(w=>{const k="v:"+w[0];S.cards[k]=S.cards[k]||{d:t,i:0,e:2.5,n:0}})}
function finish(){const l=R.l,sc=R.ok/R.n,pass=sc>=.7;let xp=0;if(pass){xp=l.id in S.done?6:20+Math.round(sc*20);S.done[l.id]=Math.max(S.done[l.id]||0,Math.round(sc*100));day().l++;addCards(l);if(sc==1)S.lerr[l.id]=0;gain(xp)}
R.res={sc,pass,xp};R.step="end";after();render()}
function pick(i){if(R.ans!=null)return;const q=R.qs[R.qi];R.ans=i;if(q.o[i]===q.a){if(!q.r)R.ok++}else{S.lerr[R.l.id]=(S.lerr[R.l.id]||0)+1;if(!q.r)R.qs.push({...q,r:1})}save();render()}
function nextQ(){R.ans=null;R.qi++;R.qi>=R.qs.length?finish():render()}
function face(id){const p=id.split(':');if(p[0]=='j'){const x=KJ.find(z=>z[0]==p[1]);return{f:x[0],b:x[1]+'. On: '+x[2]+'. Kun: '+x[3],q:'¿Qué significa?'}}if(p[0]=='s'){const x=S.sv[p[1]];return{f:p[1],b:x[0]+': '+x[1],q:'¿Qué significa?',s:p[1]}}if(p[0]=="k"){const c=ALLK.find(x=>x.h==p[2]);return{f:p[1]=="k"?kat(c.h):c.h,b:c.r,q:"¿Cómo se lee?",s:p[1]=="k"?kat(c.h):c.h}}
const w=VOC.flatMap(v=>v.w).find(x=>x[0]==p[1]),dir=S.cards[id].n%2;return dir?{f:w[2],b:w[0]+" ("+w[1]+")",q:"¿Cómo se dice en japonés?",x:w}:{f:w[0],b:w[1]+": "+w[2],q:"¿Qué significa?",s:w[0],x:w}}
function grade(g){const id=RV.q[RV.i],c=S.cards[id];if(g==0){c.i=0;c.d=Date.now()+6e5;c.e=Math.max(1.3,c.e-.2);c.n=0;RV.q.push(id)}else{c.i=c.n==0?1:c.n==1?3:Math.round(c.i*c.e*(g==2?1.4:1));c.e+=g==2?.1:0;c.n++;c.d=Date.now()+c.i*864e5;gain(g)}
day().r++;S.rev++;RV.i++;RV.show=false;after();render()}

if(R.step=="quiz"){const q=R.qs[R.qi],a=R.ans;return`<div class=row><span class=mu>Pregunta ${R.qi+1} de ${R.qs.length}</span><button class="btn alt" style="width:auto;margin:0;padding:6px 12px" data-a=go data-v=path>Salir</button></div>${bar(Math.round(R.qi/R.qs.length*100))}${q.big?`<div class=big>${q.big}</div>${q.sub?`<p class=mu style="text-align:center">${q.sub}</p>`:""}`:""}<p style="text-align:center;font-size:18px;margin:14px 0">${q.p}</p>
<div class=opts>${q.o.map((o,i)=>`<button class="opt ${a==null?"":o===q.a?"ok":i==a?"no":""}" data-a=pick data-v=${i} ${a==null?"":"disabled"}>${o}</button>`).join("")}</div>
${a==null?"":`<div class=card style="margin-top:14px"><p><b>${q.o[a]===q.a?"Correcto":"Respuesta: "+q.a}</b></p>${q.w?`<p class=mu>${q.w}</p>`:""}${q.o[a]!==q.a&&!q.r?`<p class=mu>Volverá a aparecer al final.</p>`:""}<button class=btn data-a=next>Continuar</button></div>`}`}
const r=R.res,ix=LS.indexOf(l),nx=ix<0?null:LS[ix+1];return`<div class=pop style="text-align:center"><div class=big>${Math.round(r.sc*100)}%</div><h2>${r.pass?"Lección completada":"Casi lo tienes"}</h2><p>${r.pass?"+"+r.xp+" XP"+(r.sc==1?". ¡Dominio perfecto!":""):"Necesitas 70% para avanzar. Repásala y vuelve a intentarlo."}</p></div>${r.pass&&nx&&unlocked(nx)?`<button class=btn data-a=open data-v="${nx.id}">Siguiente: ${nx.title}</button>`:""}<button class="btn alt" data-a=open data-v="${l.id}">Repetir</button><button class="btn alt" data-a=go data-v=path>Volver a la ruta</button>`}
