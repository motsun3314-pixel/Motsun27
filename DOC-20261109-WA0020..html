const KJ=[["古","ふる-い / コ","viejo"],["池","いけ / チ","estanque"],["蛙","かわず・かえる","rana"],["飛","と-ぶ / ヒ","volar, saltar"],["水","みず / スイ","agua"],["音","おと / オン","sonido"],["春","はる / シュン","primavera"],["海","うみ / カイ","mar"],["痩","や-せる","adelgazar"],["負","ま-ける / フ","perder"],["閑","しず-か / カン","quietud"],["岩","いわ / ガン","roca"],["蝉","せみ","cigarra"],["声","こえ / セイ","voz"],["茶","チャ","té (en 一茶)"],["月","つき / ゲツ","luna"],["雪","ゆき / セツ","nieve"],["山","やま / サン","montaña"],["花","はな / カ","flor"],["青","あお-い / セイ","azul, verde"],["夏","なつ / カ","verano"],["秋","あき / シュウ","otoño"],["旅","たび / リョ","viaje"],["夢","ゆめ / ム","sueño"],["村","むら / ソン","pueblo"],["鐘","かね / ショウ","campana"],["東","ひがし / トウ","este"],["西","にし / セイ","oeste"],["子","こ / シ","niño"]];
const HIRA="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
const ROMA="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n".split(" ");
const WORDS=[],seen={};P.forEach(p=>p.w.forEach(x=>{if(!x[6]&&!seen[x[0]]){seen[x[0]]=1;WORDS.push(x)}}));
const hasK=s=>/[\u4e00-\u9fff]/.test(s);
const R=(s,r,on)=>on&&hasK(s)?`<ruby>${s}<rt>${r}</rt></ruby>`:s;
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const $=id=>document.getElementById(id);
let tab="poemas",pi=0,sel=null,o={f:true,r:false,m:false,t:true},kata=false,mode="sig",sc=[0,0],q=null;
const app=$("app");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
function draw(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));({poemas,quiz,aprender})[tab]()}
function poemas(){
const p=P[pi];let h=`<div class="card"><div class="opts">${P.map((x,i)=>`<button class="${i==pi?"on":""}" data-p="${i}">${i+1}</button>`).join("")}</div>
<h2 style="margin:6px 0">${pi+1}. ${p.t}</h2><div class="mu">${LV[p.lv]} · ${p.a}</div>
<div class="opts">${[["f","Furigana"],["r","Romaji"],["m","Significados"],["t","Traducción"]].map(([k,n])=>`<label><input type="checkbox" data-o="${k}" ${o[k]?"checked":""}>${n}</label>`).join("")}</div>`;
let i=0;p.l.forEach(n=>{h+=`<div class="line">`;for(let j=0;j<n;j++,i++){const x=p.w[i];h+=`<div class="chip ${x[6]?"p":""} ${sel===i?"sel":""}" data-w="${i}"><div class="j">${R(x[0],x[1],o.f)}</div>${o.r?`<div class="s">${x[2]}</div>`:""}${o.m?`<div class="s">${x[3]}</div>`:""}</div>`}h+=`</div>`});
if(o.t)h+=`<p><b>Traducción:</b> ${p.tr}</p>`;
h+=`<p class="mu">Las partículas están resaltadas en rojo. Toca una palabra para ver su análisis.</p></div>`;
if(sel!==null){const x=p.w[sel];h+=`<div class="card det"><h3>${R(x[0],x[1],true)} <span class="mu">${x[1]} · ${x[2]}</span></h3><p><span class="tag ${x[6]?"p":""}">${x[4]}</span></p><p><b>Significado:</b> ${x[3]}</p>${x[5]?`<p><b>Gramática:</b> ${x[5]}</p>`:""}${hasK(x[0])?`<p class="mu"><b>Kanji:</b> ${[...x[0]].filter(hasK).map(c=>{const k=KJ.find(z=>z[0]==c);return k?`${c} (${k[2]}; ${k[1]})`:c}).join(" · ")}</p>`:""}</div>`}
app.innerHTML=h;
app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pi=+b.dataset.p;sel=null;poemas()});
app.querySelectorAll("[data-o]").forEach(b=>b.onchange=()=>{o[b.dataset.o]=b.checked;poemas()});
app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{sel=+b.dataset.w;poemas()});}
function newQ(){
if(mode==="sig"){const w=WORDS[Math.random()*WORDS.length|0];q={q:`<div class="q">${R(w[0],w[1],true)}</div><div class="mu" style="text-align:center">${w[2]}: ¿qué significa?</div>`,c:w[3],o:sh([w[3],...sh(WORDS.filter(x=>x!==w)).slice(0,3).map(x=>x[3])])}}
else if(mode==="lec"){const L=WORDS.filter(x=>hasK(x[0])),w=L[Math.random()*L.length|0];q={q:`<div class="q">${w[0]}</div><div class="mu" style="text-align:center">${w[3]}: ¿cómo se lee?</div>`,c:w[1],o:sh([w[1],...sh(L.filter(x=>x!==w)).slice(0,3).map(x=>x[1])])}}
else if(mode==="kan"){const k=KJ[Math.random()*KJ.length|0];q={q:`<div class="q">${k[0]}</div><div class="mu" style="text-align:center">¿Qué significa este kanji?</div>`,c:k[2],o:sh([k[2],...sh(KJ.filter(x=>x!==k)).slice(0,3).map(x=>x[2])])}}
else{const PP=P.filter(z=>z.w.some(y=>y[6])),p=PP[Math.random()*PP.length|0],ix=p.w.map((x,i)=>x[6]?i:-1).filter(i=>i>=0),t=ix[Math.random()*ix.length|0],c=p.w[t][0];
q={q:`<div class="q">${p.w.map((x,i)=>i===t?"＿＿":x[0]).join(" ")}</div><div class="mu" style="text-align:center">${p.tr}<br>${p.w[t][5]?"Pista: "+p.w[t][5]:""}</div>`,c,o:sh([c,...sh(["の","に","や","かな","な","は","を","が","で","と"].filter(x=>x!==c)).slice(0,3)])}}}
function quiz(){
if(!q)newQ();
const M=[["sig","Significado"],["lec","Lectura"],["par","Partículas"],["kan","Kanji"]];
app.innerHTML=`<div class="card"><div class="opts">${M.map(([k,n])=>`<button class="${k==mode?"on":""}" data-m="${k}">${n}</button>`).join("")}</div><div class="sc">Aciertos: ${sc[0]} / ${sc[1]}</div>${q.q}<div class="ans">${q.o.map(x=>`<button data-a="${x}">${x}</button>`).join("")}</div><div id="fb" class="mu" style="margin-top:10px"></div></div>`;
app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;q=null;quiz()});
app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(q.done)return;q.done=1;sc[1]++;const good=b.dataset.a===q.c;if(good)sc[0]++;
app.querySelectorAll("[data-a]").forEach(x=>{if(x.dataset.a===q.c)x.classList.add("ok")});if(!good)b.classList.add("no");
$("fb").innerHTML=(good?"¡Correcto! ":"Respuesta: <b>"+q.c+"</b>. ")+`<button id="nx">Siguiente</button>`;$("nx").onclick=()=>{q=null;quiz()}})}
function aprender(){
const conv=c=>kata?String.fromCharCode(c.charCodeAt(0)+96):c;
app.innerHTML=`<div class="card"><b>Kana</b> <button id="kt" style="float:right">${kata?"Ver hiragana":"Ver katakana"}</button><p class="mu">Toca un carácter para ver su romaji. 46 sílabas básicas.</p><div class="kg">${[...HIRA].map((c,i)=>`<button data-r="${i}">${conv(c)}<small>${ROMA[i]}</small></button>`).join("")}</div></div>
<div class="card"><b>Partículas</b><table>${PART.map(x=>`<tr><td style="font-size:20px">${x[0]}<div class="mu">${x[1]}</div></td><td>${x[2]}<div class="mu">${x[3]}</div></td></tr>`).join("")}</table></div>
<div class="card"><b>Kanji de los poemas</b><table>${KJ.map(x=>`<tr><td style="font-size:24px">${x[0]}</td><td>${x[2]}<div class="mu">${x[1]}</div></td></tr>`).join("")}</table><p class="mu">Lecturas: en minúscula = kun (japonesa); en katakana = on (china).</p></div>
<div class="card"><b>Vocabulario</b><table>${WORDS.map(x=>`<tr><td>${R(x[0],x[1],true)}<div class="mu">${x[2]}</div></td><td>${x[3]}<div class="mu">${x[4]}</div></td></tr>`).join("")}</table></div>`;
$("kt").onclick=()=>{kata=!kata;aprender()};}
draw();
</script></body></html>
