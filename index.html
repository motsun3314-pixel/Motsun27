<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#12161B"><link rel="icon" href="icon-192.png"><title>Nihongo: aprende japonés</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#F2F3EF;--sf:#FFFFFF;--tx:#1B2530;--mu:#667180;--ac:#264A6B;--on:#FFFFFF;--sh:#C8432B;--ok:#2F7D5B;--bd:#DADDD6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161B;--sf:#1B2129;--tx:#E8EBEE;--mu:#98A3B0;--ac:#8DB4DB;--on:#12161B;--sh:#E0705A;--ok:#5BBE95;--bd:#2A323C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161B;--sf:#1B2129;--tx:#E8EBEE;--mu:#98A3B0;--ac:#8DB4DB;--on:#12161B;--sh:#E0705A;--ok:#5BBE95;--bd:#2A323C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 96px}
h1{font:600 34px/1.2 "Shippori Mincho","Hiragino Mincho ProN",serif;margin:4px 0 2px}
h2{font-size:18px;margin:22px 0 10px}h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-weight:700;width:100%;margin-top:8px}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:focus-visible{outline:3px solid var(--sh);outline-offset:2px}
.big{font:600 72px/1.1 "Shippori Mincho","Hiragino Mincho ProN",serif;text-align:center;margin:12px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 8px;font-size:18px;min-height:54px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--sf))}
.opt.no{border-color:var(--sh);background:color-mix(in srgb,var(--sh) 16%,var(--sf))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 4px;text-align:center}
.tile b{display:block;font:600 34px/1.2 "Shippori Mincho",serif}
.lsn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.lsn[disabled]{opacity:.45;cursor:not-allowed}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-weight:700;flex:none}
.dot.d{background:var(--ok);border-color:var(--ok);color:var(--on)}
.f{background:var(--bg);border-left:3px solid var(--sh);padding:8px 12px;font-weight:700}
.ex{border-left:3px solid var(--ac);padding:2px 12px;margin:8px 0;font-size:18px}.ex span{display:block;font-size:14px;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:13px 2px;font-size:13px;color:var(--mu);position:relative}
nav button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 3px var(--sh)}
nav em{position:absolute;top:6px;margin-left:2px;background:var(--sh);color:var(--on);border-radius:9px;font:700 11px/1 inherit;padding:3px 5px;font-style:normal}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%}
.toast.s{opacity:1;transform:translate(-50%,0)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal i{aspect-ratio:1;border-radius:5px;background:var(--bd)}.cal i.a{background:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}.bars i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.pop{animation:pop .5s}@keyframes pop{from{transform:scale(.6);opacity:0}}
.ck{color:var(--ok);font-weight:700}canvas{width:100%;max-width:300px;aspect-ratio:1;touch-action:none;background:var(--sf);border:1px solid var(--bd);border-radius:12px;display:block;margin:8px auto}.msg{padding:10px 12px;border-radius:12px;margin:0 0 8px;max-width:88%;white-space:pre-wrap}.msg.u{background:var(--ac);color:var(--on);margin-left:auto}.msg.a{background:var(--sf);border:1px solid var(--bd)}.tk{background:none;border:0;border-bottom:2px dotted var(--sh);padding:0 1px;font:inherit;color:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="m"></main><nav id="n"></nav><div id="t" class="toast" role="status"></div>
<script>
const KEY="nihongo-v1",$=s=>document.querySelector(s);
const HS="あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をwo んn".split(" ");
const KANA=HS.map(s=>({h:s[0],r:s.slice(1)})),kat=c=>[...c].map(x=>String.fromCharCode(x.charCodeAt(0)+96)).join('');
const RN=["Vocales","Fila K","Fila S","Fila T","Fila N","Fila H","Fila M","Fila Y","Fila R","Fila W y N"],RS=[5,5,5,5,5,5,5,3,5,3];
const VOC=[
{t:"Saludos y básicos",w:[["おはよう","おはよう","buenos días","expresión","おはよう、たなかさん。","Buenos días, Tanaka."],["こんにちは","こんにちは","hola","expresión","こんにちは、はじめまして。","Hola, mucho gusto."],["ありがとう","ありがとう","gracias","expresión","どうもありがとう。","Muchas gracias."],["はい","はい","sí","expresión","はい、わかりました。","Sí, entendido."],["いいえ","いいえ","no","expresión","いいえ、だいじょうぶです。","No, estoy bien."],["すみません","すみません","disculpe","expresión","すみません、もういちど。","Perdón, otra vez por favor."],["私","わたし","yo","pronombre","わたしはマリアです。","Yo soy María."],["名前","なまえ","nombre","sustantivo","なまえはなんですか。","¿Cómo te llamas?"]]},
{t:"Personas y cosas",w:[["水","みず","agua","sustantivo","みずをください。","Agua, por favor."],["ご飯","ごはん","comida, arroz","sustantivo","ごはんをたべます。","Como arroz."],["本","ほん","libro","sustantivo","ほんをよみます。","Leo un libro."],["学生","がくせい","estudiante","sustantivo","わたしはがくせいです。","Soy estudiante."],["先生","せんせい","profesor","sustantivo","かれはせんせいです。","Él es profesor."],["猫","ねこ","gato","sustantivo","ねこがすきです。","Me gustan los gatos."],["犬","いぬ","perro","sustantivo","いぬはいえにいます。","El perro está en casa."],["家","いえ","casa","sustantivo","いえにかえります。","Vuelvo a casa."]]},
{t:"Acciones y descripciones",w:[["食べる","たべる","comer","verbo","さかなをたべる。","Como pescado."],["飲む","のむ","beber","verbo","おちゃをのむ。","Bebo té."],["行く","いく","ir","verbo","がっこうへいく。","Voy a la escuela."],["見る","みる","ver","verbo","テレビをみる。","Veo televisión."],["大きい","おおきい","grande","adjetivo い","おおきいいえです。","Es una casa grande."],["小さい","ちいさい","pequeño","adjetivo い","ちいさいねこです。","Es un gato pequeño."],["静か","しずか","tranquilo","adjetivo な","しずかなまちです。","Es un pueblo tranquilo."],["好き","すき","que gusta","adjetivo な","いぬがすきです。",'Me gustan los perros.']]},{t:'Familia y lugares',w:[['母','はは','mi madre','sustantivo','はははせんせいです。','Mi madre es profesora.'],['父','ちち','mi padre','sustantivo','ちちはいえにいます。','Mi padre está en casa.'],['友達','ともだち','amigo','sustantivo','ともだちとはなします。','Hablo con un amigo.'],['学校','がっこう','escuela','sustantivo','がっこうにいきます。','Voy a la escuela.'],['駅','えき','estación','sustantivo','えきはどこですか。','¿Dónde está la estación?'],['トイレ','トイレ','baño','sustantivo','トイレはあそこです。','El baño está allá.'],['どこ','どこ','¿dónde?','pregunta','ここはどこですか。','¿Dónde estamos?'],['何','なに','¿qué?','pregunta','これはなんですか。','¿Qué es esto?']]},{t:'Tiempo y comida',w:[['今日','きょう','hoy','tiempo','きょうはあついです。','Hoy hace calor.'],['明日','あした','mañana','tiempo','あしたがっこうにいきます。','Mañana voy a la escuela.'],['今','いま','ahora','tiempo','いまなんじですか。','¿Qué hora es?'],['お茶','おちゃ','té','sustantivo','おちゃをください。','Té, por favor.'],['パン','パン','pan','sustantivo','パンをたべます。','Como pan.'],['魚','さかな','pescado','sustantivo','さかながすきです。','Me gusta el pescado.'],['買う','かう','comprar','verbo','パンをかいます。','Compro pan.'],['話す','はなす','hablar','verbo','ともだちとはなす。','Hablo con un amigo.']]}];
const GR=[
{t:"は y です: «A es B»",x:"<p>は marca el <b>tema</b> de la oración y se lee <b>wa</b>. です cierra la frase con cortesía y funciona como «ser».</p><p class=f>A は B です</p><p>Negativo cortés: ではありません.</p><p class=mu>Error frecuente: leer は como «ha». Como partícula siempre es «wa».</p>",ex:[["わたしはがくせいです。","Yo soy estudiante."],["これはほんです。","Esto es un libro."]],q:[["わたし＿がくせいです。",["は","を","に","で"],"は","は marca el tema: «yo»."],["¿Cómo se lee は en これはほんです?",["wa","ha","ba","no"],"wa","Como partícula, は se lee wa."],["«Él es profesor»",["かれはせんせいです。","かれをせんせいです。","かれにせんせいです。"],"かれはせんせいです。","Tema + は + sustantivo + です."],["Negativo de がくせいです",["がくせいではありません","がくせいですない","がくせいでした"],"がくせいではありません","です pasa a ではありません."]]},
{t:"を: el objeto",x:"<p>を (se lee <b>o</b>) marca el <b>objeto directo</b>: lo que recibe la acción.</p><p class=f>Objeto を Verbo</p><p>Los verbos corteses terminan en ます: たべる → たべます.</p>",ex:[["みずをのみます。","Bebo agua."],["ほんをよみます。","Leo un libro."]],q:[["みず＿のみます。",["を","は","に","の"],"を","El agua es lo que se bebe: objeto directo."],["ごはん＿たべます。",["を","で","へ","と"],"を","Lo que se come es el objeto."],["ほんをよみます significa…",["Leo un libro","Voy al libro","Estoy en el libro"],"Leo un libro","を + よみます (leer)."],["Forma ます de たべる",["たべます","たべるます","たべです"],"たべます","Se quita る y se añade ます."]]},
{t:"に y で: lugares",x:"<p><b>に</b>: destino, hora exacta y lugar donde algo existe (います, あります).</p><p><b>で</b>: lugar donde ocurre una acción, o medio.</p><p class=f>Lugar に いきます / Lugar で Verbo</p>",ex:[["がっこうにいきます。","Voy a la escuela."],["レストランでたべます。","Como en el restaurante."]],q:[["がっこう＿いきます。",["に","で","を","と"],"に","Destino de un movimiento: に."],["レストラン＿ごはんをたべます。",["で","に","は","の"],"で","Lugar donde ocurre la acción: で."],["ねこはいえ＿います。",["に","で","を","も"],"に","Existencia (います) usa に."],["しちじ＿おきます。",["に","で","を","が"],"に","Las horas exactas llevan に."]]},
{t:"Adjetivos い y な",x:"<p>Los adjetivos <b>い</b> terminan en い (おおきい). Los <b>な</b> necesitan な ante un sustantivo (しずかなまち).</p><p class=f>Negativo い: quita い y añade くない</p><p class=mu>Ojo: きれい termina en い pero es un adjetivo な.</p>",ex:[["おおきいいえです。","Es una casa grande."],["しずかなまちです。","Es un pueblo tranquilo."]],q:[["しずか＿まち",["な","の","が","い"],"な","しずか es adjetivo な."],["«Gato pequeño»",["ちいさいねこ","ちいさくねこ","ちいさのねこ"],"ちいさいねこ","El adjetivo い va directo ante el sustantivo."],["Negativo de たかい (caro)",["たかくない","たかじゃない","たかいくない"],"たかくない","Se cambia い por くない."],["きれい (bonito) es un adjetivo…",["tipo な","tipo い"],"tipo な",'Termina en い, pero es な: きれいなひと.']]},{t:'Verbos en ます: presente y pasado',x:'<p>Forma cortés: <b>ます</b> (presente o futuro), <b>ません</b> (negativo), <b>ました</b> (pasado) y <b>ませんでした</b> (pasado negativo).</p><p class=f>たべます, たべません, たべました, たべませんでした</p>',ex:[['あさごはんをたべました。','Desayuné.'],['おちゃをのみません。','No bebo té.']],q:[['«No como pescado»',['さかなをたべません','さかなをたべました','さかなをたべます'],'さかなをたべません','ません niega el presente.'],['Pasado de いきます',['いきました','いきません','いきましょう'],'いきました','ます pasa a ました.'],['«Ayer vi televisión»',['きのうテレビをみました','きのうテレビをみます','きのうテレビをみません'],'きのうテレビをみました','Ayer es pasado: ました.'],['Pasado negativo de のみます',['のみませんでした','のみました','のみません'],'のみませんでした','ませんでした significa «no hice».']]},{t:'も, と, の y から',x:'<p><b>も</b> = también. <b>と</b> = y, con. <b>の</b> = de (posesión). <b>から</b> = desde.</p><p class=f>わたしの + sustantivo / A と B / A も</p>',ex:[['わたしのほんです。','Es mi libro.'],['ともだちとたべます。','Como con un amigo.']],q:[['«Yo también soy estudiante»: わたし＿がくせいです。',['も','は','の','と'],'も','も significa «también».'],['«Mi libro»: わたし＿ほん',['の','と','も','で'],'の','の indica posesión.'],['«Con un amigo»: ともだち＿いきます。',['と','を','の','も'],'と','と significa «con».'],['«Desde las nueve»: くじ＿',['から','まで','の','を'],'から','から significa «desde».']]},{t:'Forma て: unir acciones',x:'<p>La forma て une acciones y es la base de muchas estructuras. Verbos en る (como たべる): quita る y añade て. Verbos en う, つ, る: って. En む, ぶ, ぬ: んで. En く: いて. La excepción es いく → いって.</p><p class=f>たべる→たべて / のむ→のんで / かく→かいて / いく→いって</p>',ex:[['ごはんをたべて、がっこうにいきます。','Como y luego voy a la escuela.'],['ともだちとはなして、かえります。','Hablo con un amigo y vuelvo.']],q:[['Forma て de たべる',['たべて','たべって','たべいて'],'たべて','Verbo en る: quita る y añade て.'],['Forma て de のむ',['のんで','のみて','のって'],'のんで','む cambia a んで.'],['Forma て de かく',['かいて','かって','かんで'],'かいて','く cambia a いて.'],['Forma て de いく (excepción)',['いって','いいて','いんで'],'いって','いく es irregular: いって.']]},{t:'Pedir y desear: てください y たい',x:'<p><b>～てください</b> = por favor, haz… (forma て + ください). <b>～たい</b> = quiero… (raíz de ます + たい).</p><p class=f>みてください / たべたい</p><p>Para たい quita ます: たべます → たべたい.</p>',ex:[['ここにかいてください。','Escriba aquí, por favor.'],['みずがのみたいです。','Quiero beber agua.']],q:[['«Por favor, mire»: み＿ください。',['て','た','ます','たい'],'て','Forma て + ください.'],['«Quiero comer»',['たべたい','たべてい','たべます'],'たべたい','Raíz de ます + たい.'],['«Quiero ir»: ¿cómo se forma?',['いき + たい','いって + たい','いく + たい'],'いき + たい','Se usa la raíz de ます (いき).'],['«Espere, por favor»: ま＿ください。',['って','いて','んで'],'って','まつ → まって (つ pasa a って).']]},{t:'N4: forma informal',x:'<p>Entre amigos se usa la forma informal. El presente es la forma de diccionario (たべる, のむ, いく). El pasado cambia て→た y で→だ.</p><p class=f>たべます→たべる / たべました→たべた / たべません→たべない</p>',ex:[['ごはんをたべた。','Comí.'],['テレビをみない。','No veo televisión.']],q:[['Informal de たべます',['たべる','たべた','たべない'],'たべる','Presente informal = forma de diccionario.'],['Pasado informal de のむ',['のんだ','のんで','のみた'],'のんだ','のんで pasa a のんだ.'],['Negativo informal de みる',['みない','みません','みなかった'],'みない','Verbo en る: quita る y añade ない.'],['Pasado informal de いく',['いった','いんだ','いきた'],'いった','Irregular, igual que いって.']]},{t:'N4: ている, estar haciendo',x:'<p>Forma て + いる expresa una acción en curso o un estado resultante.</p><p class=f>たべている = estoy comiendo / すんでいる = vivo en</p>',ex:[['いまごはんをたべています。','Ahora estoy comiendo.'],['とうきょうにすんでいます。','Vivo en Tokio.']],q:[['«Estoy leyendo»: よんで＿',['います','ください','たい','ました'],'います','Forma て + います.'],['«Estoy bebiendo té»',['おちゃをのんでいます','おちゃをのみています','おちゃをのむています'],'おちゃをのんでいます','のむ pasa a のんで + います.'],['«Vivo en Tokio»: すんで＿',['います','あります','です'],'います','Estado resultante: すんでいます.'],['Negativo de たべています',['たべていません','たべません','たべていない です'],'たべていません','います pasa a いません.']]},{t:'N4: condicional たら',x:'<p>Pasado informal + ら significa «si» o «cuando».</p><p class=f>たべた→たべたら / のんだ→のんだら / いった→いったら</p>',ex:[['あめがふったら、いきません。','Si llueve, no voy.'],['おわったら、でんわします。','Cuando termine, llamaré.']],q:[['«Si como»: たべ＿',['たら','ば','ない','て'],'たら','たべた + ら.'],['たら de のむ',['のんだら','のむたら','のんでら'],'のんだら','のんだ + ら.'],['«Si voy»: い＿',['ったら','いたら','んだら'],'ったら','いく, いった, いったら.'],['«Si llueve, no voy»: あめがふ＿、いきません。',['ったら','んだら','いたら'],'ったら','ふる, ふった, ふったら.']]},{t:'N3: ようになる',x:'<p>Verbo de diccionario + ようになる = «llegar a…» (cambio gradual). Para «dejar de…» se usa ～なくなる.</p><p class=f>はなせるようになる / いけなくなる</p>',ex:[['にほんごがはなせるようになりました。','Llegué a poder hablar japonés.'],['さかながたべられなくなりました。','Dejé de poder comer pescado.']],q:[['«Llegué a poder leer»: よめる＿なりました。',['ように','ために','ので','から'],'ように','Verbo + ようになる.'],['«Dejé de poder ir»: いけ＿なりました。',['なく','ない','ません','ず'],'なく','Negativo: ～なくなる.'],['Pasado de ようになる',['ようになった','ようになる','ようにならない'],'ようになった','Pasado informal: なった.']]},{t:'N3: ために',x:'<p>Verbo de diccionario + ために = «para (lograr algo)». Sustantivo + の + ために = «por / para».</p><p class=f>にほんにいくために、べんきょうします</p>',ex:[['にほんにいくために、おかねをためます。','Ahorro dinero para ir a Japón.'],['かぞくのためにはたらきます。','Trabajo por mi familia.']],q:[['«Estudio para aprobar»: ごうかくする＿べんきょうします。',['ために','ながら','たら','から'],'ために','Verbo + ために = para…'],['«Por mi familia»: かぞく＿ために',['の','を','は','に'],'の','Sustantivo + の + ために.'],['«Ahorro para viajar»',['りょこうするためにためます','りょこうしたためにためます','りょこうするとためます'],'りょこうするためにためます','Se usa la forma de diccionario.']]}];

else if(l.type=='read'){const sp=l.L.map(x=>x[0].map(t=>typeof t=='string'?t:t[1]).join('')).join('。'),s=R.sel&&l.L[R.sel[0]][0][R.sel[1]];c=`<p class=mu>Toca una palabra subrayada para ver su significado.</p><div class=card>${l.L.map((x,i)=>`<p style='font-size:20px;margin:0 0 4px'>${x[0].map((t,j)=>typeof t=='string'?t:`<button class=tk data-a=tk data-v='${i},${j}'>${t[0]}</button>`).join('')}</p>${R.tr?`<p class=mu>${x[1]}</p>`:''}`).join('')}</div>${s?`<div class=card><b style='font-size:22px'>${s[0]}</b> ${s[1]}<br>${s[2]}<button class=btn data-a=sv>${S.sv[s[0]]?'Guardada en el repaso':'Guardar en el repaso'}</button></div>`:''}<button class='btn alt' data-a=say data-v='${sp}'>Escuchar texto</button><button class='btn alt' data-a=tr>${R.tr?'Ocultar':'Mostrar'} traducción</button>`}
else c=l.g.x+"<h3>Ejemplos</h3>"+l.g.ex.map(e=>`<div class=ex>${e[0]}<span>${e[1]}</span></div>`).join("");
return`<button class="btn alt" style="width:auto;margin:0 0 10px" data-a=go data-v=path>Volver</button><h1>${l.title}</h1><p class=mu>${l.unit}</p>${c}<button class=btn data-a=start>Empezar práctica</button>`}
if(R.step=="quiz"){const q=R.qs[R.qi],a=R.ans;return`<div class=row><span class=mu>Pregunta ${R.qi+1} de ${R.qs.length}</span><button class="btn alt" style="width:auto;margin:0;padding:6px 12px" data-a=go data-v=path>Salir</button></div>${bar(Math.round(R.qi/R.qs.length*100))}${q.big?`<div class=big>${q.big}</div>${q.sub?`<p class=mu style="text-align:center">${q.sub}</p>`:""}`:""}<p style="text-align:center;font-size:18px;margin:14px 0">${q.p}</p>
<div class=opts>${q.o.map((o,i)=>`<button class="opt ${a==null?"":o===q.a?"ok":i==a?"no":""}" data-a=pick data-v=${i} ${a==null?"":"disabled"}>${o}</button>`).join("")}</div>
${a==null?"":`<div class=card style="margin-top:14px"><p><b>${q.o[a]===q.a?"Correcto":"Respuesta: "+q.a}</b></p>${q.w?`<p class=mu>${q.w}</p>`:""}${q.o[a]!==q.a&&!q.r?`<p class=mu>Volverá a aparecer al final.</p>`:""}<button class=btn data-a=next>Continuar</button></div>`}`}
const r=R.res,ix=LS.indexOf(l),nx=ix<0?null:LS[ix+1];return`<div class=pop style="text-align:center"><div class=big>${Math.round(r.sc*100)}%</div><h2>${r.pass?"Lección completada":"Casi lo tienes"}</h2><p>${r.pass?"+"+r.xp+" XP"+(r.sc==1?". ¡Dominio perfecto!":""):"Necesitas 70% para avanzar. Repásala y vuelve a intentarlo."}</p></div>${r.pass&&nx&&unlocked(nx)?`<button class=btn data-a=open data-v="${nx.id}">Siguiente: ${nx.title}</button>`:""}<button class="btn alt" data-a=open data-v="${l.id}">Repetir</button><button class="btn alt" data-a=go data-v=path>Volver a la ruta</button>`}
function vRev(){if(!RV)RV={q:dueList().slice(0,15),i:0,show:false};
if(RV.i>=RV.q.length)return`<h1>Repaso</h1><div class=card><h3>${RV.q.length?"Sesión terminada":"Nada pendiente"}</h3><p class=mu>${RV.q.length?"Las tarjetas difíciles volverán pronto y las dominadas se espaciarán más.":"Las palabras y kana de cada lección completada se añaden aquí automáticamente."}</p><button class=btn data-a=go data-v=path>Ir a la ruta</button></div>`;
const id=RV.q[RV.i],f=face(id);return`<h1>Repaso</h1><p class=mu>Tarjeta ${RV.i+1} de ${RV.q.length}. Intenta recordar antes de mirar.</p><div class=card><p class=mu style="text-align:center">${f.q}</p><div class=big>${f.f}</div>${RV.show?`<h2 style="text-align:center">${f.b}</h2>${f.x?`<div class=ex>${f.x[4]}<span>${f.x[5]}</span></div>`:""}`:""}${f.s?`<button class="btn alt" data-a=say data-v="${f.s=="私"?"わたし":f.s}">Escuchar</button>`:""}</div>
${RV.show?`<div class=opts style="grid-template-columns:1fr 1fr 1fr"><button class=opt data-a=grade data-v=0>Otra vez</button><button class=opt data-a=grade data-v=1>Bien</button><button class=opt data-a=grade data-v=2>Fácil</button></div>`:`<button class=btn data-a=show>Mostrar respuesta</button>`}`}
function vStats(){const t=LS.length,k=Object.entries(S.cards).filter(([i,c])=>i[0]=="k"&&c.n>=2).length,w=Object.entries(S.cards).filter(([i,c])=>i[0]=="v"&&c.n>=1).length;
const ds=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return(S.days[fmt(d)]||{}).xp||0}),mx=Math.max(1,...ds);
const cal=[...Array(28)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-27+i);return`<i class="${(S.days[fmt(d)]||{}).xp?"a":""}"></i>`}).join("");
const sk=[['Hiragana','h',21],['Katakana','k',21],['Vocabulario','v',5],['Gramática','g',13],['Kanji','j',Math.ceil(KJ.length/5)],['Lecturas','r',5]].map(s=>`<p class=row style="margin:8px 0 4px"><span>${s[0]}</span><span class=mu>${Math.round(dc(s[1])/s[2]*100)}%</span></p>${bar(dc(s[1])/s[2]*100)}`).join("");
const wk=LS.filter(l=>S.lerr[l.id]>0).sort((a,b)=>S.lerr[b.id]-S.lerr[a.id]).slice(0,3);
return`<h1>Progreso</h1><div class=card><p>Lecciones: <b>${Object.keys(S.done).length} de ${t}</b></p><p>Kana reconocidos: <b>${k}</b></p><p>Palabras en repaso: <b>${w}</b></p><p>Kanji en repaso: <b>${Object.keys(S.cards).filter(i=>i[0]=='j').length}</b></p><p>Tarjetas repasadas: <b>${S.rev}</b></p><p style="margin:0">Tiempo de estudio: <b>${Math.round(S.secs/60)} min</b></p></div>
<h2>Dominio por área</h2><div class=card>${sk}</div>
<h2>Necesita refuerzo</h2><div class=card>${wk.length?wk.map(l=>`<p class=row style="margin:0 0 6px"><span>${l.title}</span><button class="btn alt" style="width:auto;margin:0;padding:6px 12px" data-a=open data-v="${l.id}">Practicar</button></p>`).join(""):`<p class=mu style="margin:0">Aún no hay errores recurrentes.</p>`}</div>
<h2>XP de los últimos 14 días</h2><div class=card><div class=bars>${ds.map(x=>`<i style="height:${x/mx*100}%"></i>`).join("")}</div></div>
<h2>Calendario de actividad</h2><div class=card><div class=cal>${cal}</div></div>
<h2>Logros</h2><div class=card>${ACH.map(a=>`<p class="${S.ach[a[0]]?"ck":"mu"}" style="margin:0 0 8px">${S.ach[a[0]]?"✓":"○"} <b>${a[0]}</b>: ${a[1]}</p>`).join("")}</div>`}
function vRead(){return`<h1>Lecturas</h1><p class=mu>Textos cortos para tu nivel. Toca las palabras subrayadas para ver su significado y guardarlas en el repaso.</p>`+RD.map(l=>{const ok=unlocked(l),dn=l.id in S.done;return`<button class=lsn data-a=open data-v='${l.id}' ${ok?'':'disabled'}><span class='dot ${dn?'d':''}'>${dn?'✓':ok?'→':'–'}</span><span><b>${l.title}</b><br><span class=mu>${ok?(dn?'Mejor resultado: '+S.done[l.id]+'%':l.sub):'Completa más lecciones para desbloquearla'}</span></span></button>`}).join('')}
let TT={m:[],lang:'ja-JP'};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function vTutor(){return`<h1>Tutor</h1><p class=mu>Conversa en japonés a tu nivel. Te corrige en español y te deja intentarlo antes de darte la respuesta.</p><div class=opts style='grid-template-columns:1fr 1fr 1fr;margin-bottom:10px'><button class='opt ${TT.voice?'ok':''}' data-a=vm>Modo voz</button><button class='opt ${TT.lang=='es-ES'?'':'ok'}' data-a=lg data-v=ja-JP>Hablo japonés</button><button class='opt ${TT.lang=='es-ES'?'ok':''}' data-a=lg data-v=es-ES>Hablo español</button></div>${TT.m.map(x=>`<div class='msg ${x.role=='user'?'u':'a'}'>${esc(x.content)}</div>`).join('')}${TT.err?`<div class=card><p><b>El tutor aún no está conectado</b></p><p class=mu style='margin:0'>${TT.err}</p></div>`:''}<textarea id=ti rows=2 placeholder='Escribe en japonés o en español' style='width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)' oninput='TT.draft=this.value'>${esc(TT.draft||'')}</textarea><button class='btn alt' data-a=mic>${TT.mic?'Escuchando…':'Hablar'}</button><button class=btn data-a=ask>${TT.busy?'Pensando…':TT.m.length?'Enviar':'Empezar conversación'}</button>`}
async function ask(){if(TT.busy)return;const t=document.getElementById('ti'),v=(t&&t.value.trim())||(TT.m.length?'':'こんにちは');if(!v)return;TT.m.push({role:'user',content:v});TT.draft='';TT.busy=true;TT.err='';render(1);
try{const r=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:TT.m,level:Object.keys(S.done).length})});if(!r.ok)throw new Error(r.status);const d=await r.json();TT.m.push({role:'assistant',content:d.reply});gain(3);if(TT.voice&&jp(d.reply)&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(jp(d.reply));u.lang='ja-JP';u.onend=()=>{if(TT.voice&&V=='tutor')listen()};speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){TT.m.pop();TT.err='Para activarlo, despliega la carpeta tutor-api (incluida con la app) en Vercel y define la variable de entorno ANTHROPIC_API_KEY. La clave queda solo en el servidor, nunca en el navegador. Luego abre la app desde ese dominio.'}
TT.busy=false;save();render(1)}
function jp(t){return(t.match(/[ぁ-ゟ゠-ヿ一-鿿ー、。！？]+/g)||[]).join(' ')}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Tu navegador no admite reconocimiento de voz. Prueba con Chrome');return}if(TT.mic)return;const r=new SR();r.lang=TT.lang;r.interimResults=false;TT.mic=true;render(1);
r.onresult=e=>{TT.draft=e.results[0][0].transcript};r.onerror=e=>{toast(e.error=='not-allowed'?'Permite el micrófono para poder hablar':'No te escuché, intenta de nuevo')};
r.onend=()=>{TT.mic=false;if(TT.draft&&TT.draft.trim()&&TT.voice)ask();else render(1)};try{r.start()}catch(e){TT.mic=false;render(1)}}
function setupCv(){const c=document.getElementById('cv');if(!c)return;const x=c.getContext('2d'),cs=getComputedStyle(document.documentElement);x.clearRect(0,0,300,300);x.font='200px "Shippori Mincho",serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle=cs.getPropertyValue('--bd');x.fillText(R.wc,150,160);x.strokeStyle=cs.getPropertyValue('--tx');x.lineWidth=8;x.lineCap='round';x.lineJoin='round';let d=false;const p=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*300/b.width,(e.clientY-b.top)*300/b.height]};
c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>{d=false}}
async function rec(t){try{speak(t);const s=await navigator.mediaDevices.getUserMedia({audio:true}),m=new MediaRecorder(s),ch=[];m.ondataavailable=e=>ch.push(e.data);m.onstop=()=>{s.getTracks().forEach(k=>k.stop());new Audio(URL.createObjectURL(new Blob(ch))).play();toast('Esta es tu voz. Compárala con el modelo')};setTimeout(()=>{m.start();toast('Grabando 3 segundos…');setTimeout(()=>m.stop(),3000)},1200)}catch(e){toast('No hay acceso al micrófono')}}
function vSet(){return`<h1>Ajustes</h1><h2>Tema</h2><div class=opts style="grid-template-columns:1fr 1fr 1fr">${[["auto","Sistema"],["light","Claro"],["dark","Oscuro"]].map(x=>`<button class="opt ${S.theme==x[0]?"ok":""}" data-a=theme data-v=${x[0]}>${x[1]}</button>`).join("")}</div>
<h2>Tus datos</h2><div class=card><p class=mu>Tu progreso se guarda solo en este navegador. La voz usa el motor de síntesis de tu dispositivo, y sus resultados varían según el sistema.</p><button class="btn alt" data-a=reset>Borrar todo el progreso</button></div>`}
function render(keep){document.documentElement.dataset.theme=S.theme=="auto"?"":S.theme;const due=dueList().length,vw=V=="lesson"?vLesson():V=="path"?vPath():V=='read'?vRead():V=='tutor'?vTutor():V=="rev"?vRev():V=="stats"?vStats():V=="set"?vSet():vHome();
$("#m").innerHTML=vw;$("#n").innerHTML=[['home','Inicio'],['path','Ruta'],['read','Leer'],["rev","Repaso"],['tutor','Tutor'],["stats","Progreso"]].map(x=>`<button class="${V==x[0]||(V=='lesson'&&x[0]==(R&&R.l.type=='read'?'read':'path'))?"on":""}" data-a=go data-v=${x[0]}>${x[1]}${x[0]=="rev"&&due?`<em>${due}</em>`:""}</button>`).join("");if(!keep)window.scrollTo(0,0);setupCv()}
document.addEventListener("click",e=>{tick();const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
if(a=="go"){V=v=='path'&&R&&R.l.type=='read'?'read':v;R=null;RV=null;render()}else if(a=="say")speak(v);else if(a=="open"){R={l:ALL.find(l=>l.id==v),step:'intro'};V='lesson';render()}else if(a=='tk'){R.sel=v.split(',').map(Number);render(1)}else if(a=='tr'){R.tr=!R.tr;render(1)}else if(a=='sv'){const t=R.l.L[R.sel[0]][0][R.sel[1]];S.sv[t[0]]=[t[1],t[2]];S.cards['s:'+t[0]]=S.cards['s:'+t[0]]||{d:Date.now(),i:0,e:2.5,n:0};save();toast('Guardada en el repaso');render(1)}
else if(a=="start"){R.step="quiz";R.qs=build(R.l);R.n=R.qs.length;R.qi=0;R.ok=0;R.ans=null;render()}else if(a=="pick")pick(+v);else if(a=="next")nextQ();
else if(a=="show"){RV.show=true;render()}else if(a=="grade")grade(+v);else if(a=='wc'){R.wc=v;speak(v);render(1)}else if(a=='cl')setupCv();else if(a=='rec')rec(v);else if(a=='vm'){TT.voice=!TT.voice;toast(TT.voice?'Modo voz: te escucho y respondo hablando':'Modo voz desactivado');render(1)}else if(a=='lg'){TT.lang=v;render(1)}else if(a=='mic')listen();else if(a=='ask')ask();else if(a=="theme"){S.theme=v;save();render()}
else if(a=="reset"&&confirm("¿Borrar todo tu progreso? No se puede deshacer.")){S=def();save();V="home";render()}});
after();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
